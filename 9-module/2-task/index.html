<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Бангкок Экспресс</title>

  <link rel="stylesheet" href="../../assets/styles/common.css" />
  <link rel="stylesheet" href="../../assets/styles/button.css" />
  <link rel="stylesheet" href="all.css">

  <script type="module">
    import Main from './index.js';

    let main = new Main();

    main.render()
      .then(() => console.log('Страница готова!'));
  </script>
</head>

<body>
  <header class="header container">
    <!-- the font does not support cyrillic -->
    <h1 class="heading logo">Bangkok Express</h1>
    <h3 class="subheading">Great food・Free delivery・Fair price</h3>

    <div class="cart-icon-holder">
      <!--СЮДА ВСТАВЛЯЕТСЯ корневой элемент из свойства cart-icon.elem-->
    </div>
  </header>

  <main>
    <div class="container carousel-holder"></div>

    <div class="container">
      <h2 class="section-heading">
        Our Menu
      </h2>
      <div class="ribbon-holder">
        <!--СЮДА ВСТАВЛЯЕТСЯ корневой элемент из свойства ribbon-menu.elem-->
      </div>
    </div>

    <div class="container">
      <div class="filters">
        <div class="filters__inner">
          <div class="filters__group">
            <label class="filters__label">Max spiciness</label>
            <div class="filters__slider slider-holder" >
              <!--СЮДА ВСТАВЛЯЕТСЯ корневой элемент из свойства step-slider.elem-->
            </div>
          </div>
          <div class="filters__group">
            <div class="filters__checkbox">
              <input
                class="styled-checkbox"
                id="exclude-nuts"
                type="checkbox"
              >
              <label for="exclude-nuts">
                <span class="filters__label">No nuts</span>
              </label>
            </div>
          </div>
          <div class="filters__group">
            <div class="filters__checkbox">
              <input
                class="styled-checkbox"
                id="vegetarian-only"
                type="checkbox"
              >
              <label for="vegetarian-only">
                <span class="filters__label">Vegetarian only</span>
              </label>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="container products-grid-holder" >
      <div class="products-grid is-loading">
        <div class="products-grid__skeleton">
          <div class="products-grid__skeleton-item"></div>
          <div class="products-grid__skeleton-item"></div>
          <div class="products-grid__skeleton-item"></div>
          <div class="products-grid__skeleton-item"></div>
          <div class="products-grid__skeleton-item"></div>
          <div class="products-grid__skeleton-item"></div>
        </div>
        <div class="products-grid__inner"></div>
      </div>
    </div>
  </main>
</body>

</html>
